<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg9" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070B16"/>
      <stop offset="1" stop-color="#0A1120"/>
    </linearGradient>
    <linearGradient id="green9" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A3E635"/>
      <stop offset="1" stop-color="#84CC16"/>
    </linearGradient>
    <filter id="glow9" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg9)"/>
  <g stroke="#16324D" stroke-width="1" opacity="0.35">
    <path d="M0 180H1280M0 360H1280M0 540H1280M160 0V720M400 0V720M640 0V720M880 0V720M1120 0V720"/>
  </g>

  <!-- Header -->
  <text x="96" y="80" font-family="Consolas, monospace" font-size="20" letter-spacing="4" fill="#22D3EE">// CONNECTIVITY &amp; PROTOCOL · 连接技术与生态协议</text>
  <text x="94" y="150" font-family="Helvetica Neue, Arial, sans-serif" font-size="44" font-weight="700" fill="#F8FAFC">连接技术与生态协议大战</text>
  <rect x="96" y="172" width="260" height="3" rx="1.5" fill="#22D3EE"/>
  <text x="96" y="196" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">来源：Apple HomeView 技术规格页 · 华为 S2 官方产品页 · 小米智能家庭屏 11 产品页 · 未披露项标注「官方未公布」</text>

  <!-- Left: Protocols overview -->
  <g transform="translate(96 220)">
    <rect x="0" y="0" width="560" height="420" rx="16" fill="#0E1830" stroke="#1E3A5F"/>
    <text x="24" y="40" font-family="Consolas, monospace" font-size="18" fill="#7DD3FC">// PROTOCOL STACK</text>

    <!-- Matter -->
    <text x="24" y="82" font-family="Helvetica Neue, sans-serif" font-size="20" font-weight="700" fill="#E2E8F0">Matter</text>
    <text x="24" y="106" font-family="Arial, sans-serif" font-size="15" fill="#94A3B8">跨品牌互操作标准 · 苹果积极参加 · 统一智能家居语言</text>
    <rect x="24" y="116" width="512" height="3" rx="1.5" fill="#1E3A5F"/>

    <!-- Thread -->
    <text x="24" y="150" font-family="Helvetica Neue, sans-serif" font-size="20" font-weight="700" fill="#E2E8F0">Thread</text>
    <text x="24" y="174" font-family="Arial, sans-serif" font-size="15" fill="#94A3B8">低功耗 Mesh 网络 · 自愈 · 端到端加密 · 抑制网络拥堵</text>
    <rect x="24" y="184" width="512" height="3" rx="1.5" fill="#1E3A5F"/>

    <!-- Zigbee -->
    <text x="24" y="218" font-family="Helvetica Neue, sans-serif" font-size="20" font-weight="700" fill="#E2E8F0">Zigbee 3.0</text>
    <text x="24" y="242" font-family="Arial, sans-serif" font-size="15" fill="#94A3B8">成熟生态 · 低功耗传感器主流 · 与 Thread 互补</text>
    <rect x="24" y="252" width="512" height="3" rx="1.5" fill="#1E3A5F"/>

    <!-- Wi-Fi -->
    <text x="24" y="286" font-family="Helvetica Neue, sans-serif" font-size="20" font-weight="700" fill="#E2E8F0">Wi-Fi 6E / 6 / 5</text>
    <text x="24" y="310" font-family="Arial, sans-serif" font-size="15" fill="#94A3B8">高速主干 · 视频/大带宽设备 · Apple 用 6E 领先</text>
    <rect x="24" y="320" width="512" height="3" rx="1.5" fill="#1E3A5F"/>

    <!-- PoE+ -->
    <text x="24" y="354" font-family="Helvetica Neue, sans-serif" font-size="20" font-weight="700" fill="#E2E8F0">PoE+ 供电</text>
    <text x="24" y="378" font-family="Arial, sans-serif" font-size="15" fill="#94A3B8">网线供电 · 简化布线 · 备用电源冗余</text>
  </g>

  <!-- Right: Comparison table -->
  <g transform="translate(680 220)">
    <!-- Header row -->
    <rect x="0" y="0" width="140" height="44" rx="10" fill="#0E1830" stroke="#1E3A5F"/>
    <text x="70" y="30" font-family="Helvetica Neue, sans-serif" font-size="14" font-weight="700" fill="#E2E8F0" text-anchor="middle">协议</text>
    <rect x="140" y="0" width="140" height="44" rx="10" fill="#0E1830" stroke="#0EA5E9"/>
    <text x="210" y="30" font-family="Helvetica Neue, sans-serif" font-size="14" font-weight="700" fill="#7DD3FC" text-anchor="middle">Apple</text>
    <rect x="280" y="0" width="140" height="44" rx="10" fill="#0E1830" stroke="#F59E0B"/>
