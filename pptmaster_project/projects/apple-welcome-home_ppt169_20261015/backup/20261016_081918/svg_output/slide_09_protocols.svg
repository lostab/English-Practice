    <rect x="420" y="0" width="140" height="44" rx="10" fill="#0E1830" stroke="#10B981"/>
    <text x="490" y="30" font-family="Helvetica Neue, sans-serif" font-size="14" font-weight="700" fill="#6EE7B7" text-anchor="middle">Xiaomi</text>

    <!-- Wi-Fi row -->
    <rect x="0" y="52" width="140" height="64" rx="10" fill="#0E1830" stroke="#1E3A5F"/>
    <text x="16" y="93" font-family="Arial, sans-serif" font-size="15" fill="#94A3B8">Wi-Fi</text>
    <rect x="140" y="52" width="140" height="64" rx="10" fill="#0E1830" stroke="#1E3A5F"/>
    <text x="158" y="84" font-family="Helvetica Neue, sans-serif" font-size="15" font-weight="600" fill="#A3E635">6E</text>
    <text x="158" y="104" font-family="Arial, sans-serif" font-size="13" fill="#64748B">官方 specs 页确认</text>
    <rect x="280" y="52" width="140" height="64" rx="10" fill="#0E1830" stroke="#1E3A5F"/>
    <text x="298" y="84" font-family="Helvetica Neue, sans-serif" font-size="15" font-weight="600" fill="#94A3B8">官方未公布</text>
    <text x="298" y="104" font-family="Arial, sans-serif" font-size="13" fill="#64748B">S2 官网未披露 Wi-Fi 版本</text>
    <rect x="420" y="52" width="140" height="64" rx="10" fill="#0E1830" stroke="#1E3A5F"/>
    <text x="438" y="84" font-family="Helvetica Neue, sans-serif" font-size="15" font-weight="600" fill="#94A3B8">双频 Wi-Fi</text>
    <text x="438" y="104" font-family="Arial, sans-serif" font-size="13" fill="#64748B">智能中控屏标准版支持双频</text>

    <!-- Thread row -->
    <rect x="0" y="124" width="140" height="64" rx="10" fill="#0E1830" stroke="#1E3A5F"/>
    <text x="16" y="165" font-family="Arial, sans-serif" font-size="15" fill="#94A3B8">Thread</text>
    <rect x="140" y="124" width="140" height="64" rx="10" fill="#0E1830" stroke="#1E3A5F"/>
    <text x="158" y="156" font-family="Helvetica Neue, sans-serif" font-size="15" font-weight="600" fill="#A3E635">1.3</text>
