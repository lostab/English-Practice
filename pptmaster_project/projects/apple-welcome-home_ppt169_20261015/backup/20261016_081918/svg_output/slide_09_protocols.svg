    <rect x="280" y="124" width="140" height="64" rx="10" fill="#0E1830" stroke="#1E3A5F"/>
    <text x="298" y="156" font-family="Helvetica Neue, sans-serif" font-size="15" font-weight="600" fill="#94A3B8">官方未公布</text>
    <rect x="420" y="124" width="140" height="64" rx="10" fill="#0E1830" stroke="#1E3A5F"/>
    <text x="438" y="156" font-family="Helvetica Neue, sans-serif" font-size="15" font-weight="600" fill="#94A3B8">Mesh 2.0</text>
    <text x="438" y="176" font-family="Arial, sans-serif" font-size="13" fill="#64748B">小米自研，非 Thread</text>

    <!-- Zigbee row -->
    <rect x="0" y="196" width="140" height="64" rx="10" fill="#0E1830" stroke="#1E3A5F"/>
    <text x="16" y="237" font-family="Arial, sans-serif" font-size="15" fill="#94A3B8">Zigbee</text>
    <rect x="140" y="196" width="140" height="64" rx="10" fill="#0E1830" stroke="#1E3A5F"/>
    <text x="158" y="228" font-family="Helvetica Neue, sans-serif" font-size="15" font-weight="600" fill="#7DD3FC">3.0</text>
    <text x="158" y="248" font-family="Arial, sans-serif" font-size="13" fill="#64748B">支持（部分设备）</text>
    <rect x="280" y="196" width="140" height="64" rx="10" fill="#0E1830" stroke="#1E3A5F"/>
    <text x="298" y="228" font-family="Helvetica Neue, sans-serif" font-size="15" font-weight="600" fill="#94A3B8">官方未公布</text>
    <rect x="420" y="196" width="140" height="64" rx="10" fill="#0E1830" stroke="#1E3A5F"/>
    <text x="438" y="228" font-family="Helvetica Neue, sans-serif" font-size="15" font-weight="600" fill="#94A3B8">支持</text>
    <text x="438" y="248" font-family="Arial, sans-serif" font-size="13" fill="#64748B">智能中控屏兼容</text>

    <!-- Matter row -->
    <rect x="0" y="268" width="140" height="64" rx="10" fill="#0E1830" stroke="#1E3A5F"/>
    <text x="16" y="309" font-family="Arial, sans-serif" font-size="15" fill="#94A3B8">Matter</text>
    <rect x="140" y="268" width="140" height="64" rx="10" fill="#0E1830" stroke="#1E3A5F"/>
    <text x="158" y="300" font-family="Helvetica Neue, sans-serif" font-size="15" font-weight="600" fill="#A3E635">1.2</text>
    <text x="158" y="320" font-family="Arial, sans-serif" font-size="13" fill="#64748B">Works with Apple Home</text>
    <rect x="280" y="268" width="140" height="64" rx="10" fill="#0E1830" stroke="#1E3A5F"/>
    <text x="298" y="300" font-family="Helvetica Neue, sans-serif" font-size="15" font-weight="600" fill="#94A3B8">官方未公布</text>
    <rect x="420" y="268" width="140" height="64" rx="10" fill="#0E1830" stroke="#1E3A5F"/>
    <text x="438" y="300" font-family="Helvetica Neue, sans-serif" font-size="15" font-weight="600" fill="#94A3B8">官方未公布</text>

    <!-- PoE row -->
    <rect x="0" y="340" width="140" height="64" rx="10" fill="#0E1830" stroke="#1E3A5F"/>
    <text x="16" y="381" font-family="Arial, sans-serif" font-size="15" fill="#94A3B8">PoE+</text>
    <rect x="140" y="340" width="140" height="64" rx="10" fill="#0E1830" stroke="#1E3A5F"/>
    <text x="158" y="372" font-family="Helvetica Neue, sans-serif" font-size="15" font-weight="600" fill="#7DD3FC">支持</text>
    <text x="158" y="392" font-family="Arial, sans-serif" font-size="13" fill="#64748B">Schneider 支架选配</text>
    <rect x="280" y="340" width="140" height="64" rx="10" fill="#0E1830" stroke="#1E3A5F"/>
    <text x="298" y="372" font-family="Helvetica Neue, sans-serif" font-size="15" font-weight="600" fill="#94A3B8">不支持</text>
    <text x="298" y="392" font-family="Arial, sans-serif" font-size="13" fill="#64748B">S2 无 PoE 规格</text>
    <rect x="420" y="340" width="140" height="64" rx="10" fill="#0E1830" stroke="#1E3A5F"/>
    <text x="438" y="372" font-family="Helvetica Neue, sans-serif" font-size="15" font-weight="600" fill="#94A3B8">不支持</text>
    <text x="438" y="392" font-family="Arial, sans-serif" font-size="13" fill="#64748B">智能家庭屏 11 无 PoE</text>
  </g>

  <!-- Bottom -->
  <rect x="96" y="650" width="1088" height="48" rx="12" fill="#0E1830" stroke="#1E3A5F" opacity="0.8"/>
  <text x="124" y="664" font-family="Helvetica Neue, Arial, sans-serif" font-size="18" fill="#E2E8F0">协议大战：Apple 全面领先（Wi-Fi 6E · Thread · Matter · PoE 供电），华为/小米以 Zigbee + 自研 Mesh 补足</text>

  <text x="1210" y="690" font-family="Consolas, monospace" font-size="14" fill="#475569">09 / 12</text>
</svg>