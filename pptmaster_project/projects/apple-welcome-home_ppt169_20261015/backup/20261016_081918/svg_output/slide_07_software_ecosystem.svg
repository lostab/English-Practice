    <text x="20" y="58" font-family="Arial, sans-serif" font-size="14.5" fill="#E2E8F0">最多 9 路视频同屏直播</text>
    <text x="20" y="80" font-family="Arial, sans-serif" font-size="14.5" fill="#E2E8F0">HomeKit Secure Video 端到端加密</text>
    <text x="20" y="102" font-family="Arial, sans-serif" font-size="13" fill="#64748B">人物/宠物/包裹/车辆识别（iCloud+）</text>

