  <!-- Bottom: Home Collection -->
  <rect x="96" y="600" width="1088" height="92" rx="14" fill="#0E1830" stroke="#0EA5E9"/>
  <text x="124" y="632" font-family="Consolas, monospace" font-size="13" fill="#7DD3FC">APPLE HOME COLLECTION · 生态破圈第一役</text>
  <text x="124" y="658" font-family="Arial, sans-serif" font-size="15" fill="#E2E8F0">与 <tspan font-weight="700" fill="#F8FAFC">LG Electronics</tspan> + <tspan font-weight="700" fill="#F8FAFC">Schneider Electric</tspan> 联合设计智能摄像头/温控器/门锁（12月起发售，部分 2027 初）</text>
  <text x="124" y="682" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8">端到端加密 · NFC 配对 · 兼容 Works with Apple Home 与 Matter · ADT 专业安装服务</text>

  <text x="1210" y="690" font-family="Consolas, monospace" font-size="15" fill="#475569">07 / 12</text>
</svg>