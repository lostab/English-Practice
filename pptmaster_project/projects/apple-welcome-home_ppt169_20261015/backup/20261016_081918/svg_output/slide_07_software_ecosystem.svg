<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg7" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070B16"/>
      <stop offset="1" stop-color="#0A1120"/>
    </linearGradient>
    <filter id="glow7" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg7)"/>
  <g stroke="#16324D" stroke-width="1" opacity="0.35">
    <path d="M0 180H1280M0 360H1280M0 540H1280M160 0V720M400 0V720M640 0V720M880 0V720M1120 0V720"/>
  </g>

  <!-- Header -->
  <text x="96" y="80" font-family="Consolas, monospace" font-size="20" letter-spacing="4" fill="#22D3EE">// HOMEVIEW EXPERIENCE · 功能矩阵（全部官方确认）</text>
  <text x="94" y="145" font-family="Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="700" fill="#F8FAFC">HomeView 功能全景：娱乐 · 连接 · 智能家居 · 隐私</text>
  <rect x="96" y="165" width="540" height="3" rx="1.5" fill="#22D3EE"/>
  <text x="96" y="192" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">来源：Apple 官方产品页 + 新闻稿（2026-10-13）· 所有功能点均有官方文字依据</text>

  <!-- 2x3 feature grid -->
  <g transform="translate(96 220)">
    <!-- F1 Entertainment -->
    <rect x="0" y="0" width="350" height="108" rx="14" fill="#0E1830" stroke="#1E3A5F"/>
    <text x="20" y="32" font-family="Consolas, monospace" font-size="13" fill="#7DD3FC">ENTERTAINMENT · 娱乐</text>
    <text x="20" y="58" font-family="Arial, sans-serif" font-size="14.5" fill="#E2E8F0">Apple Music 歌词/专辑动画 · Podcasts ·</text>
    <text x="20" y="80" font-family="Arial, sans-serif" font-size="14.5" fill="#E2E8F0">News 有声故事 · 兼容第三方音视频 App</text>
    <text x="20" y="102" font-family="Arial, sans-serif" font-size="13" fill="#64748B">Handoff 无缝续播 · 多房间 AirPlay</text>

    <!-- F2 FaceTime & Calling -->
    <rect x="364" y="0" width="350" height="108" rx="14" fill="#0E1830" stroke="#1E3A5F"/>
    <text x="20" y="32" font-family="Consolas, monospace" font-size="13" fill="#7DD3FC">CONNECT · 连接</text>
    <text x="20" y="58" font-family="Arial, sans-serif" font-size="14.5" fill="#E2E8F0">FaceTime + Center Stage 智能构图</text>
    <text x="20" y="80" font-family="Arial, sans-serif" font-size="14.5" fill="#E2E8F0">Intercom 家庭广播 · 语音收发消息</text>
    <text x="20" y="102" font-family="Arial, sans-serif" font-size="13" fill="#64748B">Find My · 实时活动 Live Activities</text>

