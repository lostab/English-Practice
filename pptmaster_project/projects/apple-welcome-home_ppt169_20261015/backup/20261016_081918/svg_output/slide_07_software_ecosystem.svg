    <text x="20" y="180" font-family="Arial, sans-serif" font-size="14.5" fill="#E2E8F0">识别烟雾/一氧化碳报警音</text>
    <text x="20" y="202" font-family="Arial, sans-serif" font-size="14.5" fill="#E2E8F0">报警推送至 iPhone/iPad/Watch</text>
    <text x="20" y="224" font-family="Arial, sans-serif" font-size="13" fill="#64748B">温湿度传感器内置 · 环境光自适应</text>

    <!-- F5 Faces -->
    <rect x="364" y="122" width="350" height="108" rx="14" fill="#0E1830" stroke="#1E3A5F"/>
    <text x="20" y="154" font-family="Consolas, monospace" font-size="13" fill="#7DD3FC">FACES · 表盘生态</text>
    <text x="20" y="180" font-family="Arial, sans-serif" font-size="14.5" fill="#E2E8F0">Photos 人像景深 · Flow 动态互动艺术</text>
    <text x="20" y="202" font-family="Arial, sans-serif" font-size="14.5" fill="#E2E8F0">Snoopy 动画 · Home Modular 面板</text>
    <text x="20" y="224" font-family="Arial, sans-serif" font-size="13" fill="#64748B">距离感应：远观概要 / 近看细节</text>

    <!-- F6 Kitchen -->
    <rect x="728" y="122" width="360" height="108" rx="14" fill="#0E1830" stroke="#1E3A5F"/>
    <text x="20" y="154" font-family="Consolas, monospace" font-size="13" fill="#7DD3FC">COOKING · 场景</text>
    <text x="20" y="180" font-family="Arial, sans-serif" font-size="14.5" fill="#E2E8F0">网页食谱一键转分步引导</text>
    <text x="20" y="202" font-family="Arial, sans-serif" font-size="14.5" fill="#E2E8F0">免提计时 · 食材追踪</text>
    <text x="20" y="224" font-family="Arial, sans-serif" font-size="13" fill="#64748B">多计时器 · 语音控制</text>
