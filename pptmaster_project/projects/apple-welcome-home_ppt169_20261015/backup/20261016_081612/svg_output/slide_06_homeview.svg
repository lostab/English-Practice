    <rect x="20" y="118" width="390" height="64" rx="10" fill="#0E2440" stroke="#22D3EE"/>
    <text x="36" y="140" font-family="Consolas, monospace" font-size="13" fill="#7DD3FC">7" LIQUID RETINA · IPS</text>
    <text x="36" y="164" font-family="Arial, sans-serif" font-size="14" fill="#E2E8F0">1088×1088 @220ppi · True Tone · 500 nits峰值/0.3 nits最低</text>

    <rect x="20" y="192" width="390" height="64" rx="10" fill="#0E2440" stroke="#22D3EE"/>
