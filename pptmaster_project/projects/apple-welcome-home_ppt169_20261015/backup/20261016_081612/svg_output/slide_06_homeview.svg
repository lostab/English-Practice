<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070B16"/>
      <stop offset="1" stop-color="#0A1120"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg6)"/>
  <g stroke="#16324D" stroke-width="1" opacity="0.35">
