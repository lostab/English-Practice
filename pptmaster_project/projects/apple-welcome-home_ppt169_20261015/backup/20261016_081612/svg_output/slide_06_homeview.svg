  <!-- Bottom takeaway -->
  <rect x="96" y="640" width="1088" height="52" rx="12" fill="#0E1830" stroke="#1E3A5F"/>
  <text x="124" y="660" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" fill="#E2E8F0"><tspan fill="#22D3EE">■</tspan> 核心卖点：<tspan fill="#7DD3FC">A18 + Secure Exclaves</tspan>（音视频隔离）+ <tspan fill="#7DD3FC">Private Cloud Compute</tspan> —— 连 Apple 都无法访问的隐私架构</text>
  <text x="124" y="682" font-family="Arial, sans-serif" font-size="13" fill="#64748B">官方未公布：RAM / 存储 / CPU核心数 / NPU TOPS / 电池 —— 本页不填任何猜测值</text>

  <text x="1210" y="690" font-family="Consolas, monospace" font-size="15" fill="#475569">06 / 12</text>
