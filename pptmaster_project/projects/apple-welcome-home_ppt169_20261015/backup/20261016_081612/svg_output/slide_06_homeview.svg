  <text x="94" y="145" font-family="Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="700" fill="#F8FAFC">Apple HomeView：规格全拆解（以官方 specs 页为准）</text>
  <rect x="96" y="165" width="640" height="3" rx="1.5" fill="#22D3EE"/>
  <text x="96" y="192" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">来源：apple.com/apple-homeview/specs/ + 官方新闻稿 · 未披露项一律标注「官方未公布」</text>

  <!-- Left: device + key highlights -->
  <g transform="translate(96 220)">
