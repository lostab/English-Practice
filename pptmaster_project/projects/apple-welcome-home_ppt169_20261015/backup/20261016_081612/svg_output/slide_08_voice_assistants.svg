<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg8" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070B16"/>
      <stop offset="1" stop-color="#0A1120"/>
    </linearGradient>
    <filter id="glow8" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg8)"/>
  <g stroke="#16324D" stroke-width="1" opacity="0.35">
    <path d="M0 180H1280M0 360H1280M0 540H1280M160 0V720M400 0V720M640 0V720M880 0V720M1120 0V720"/>
  </g>

  <!-- Header -->
  <text x="96" y="80" font-family="Consolas, monospace" font-size="20" letter-spacing="4" fill="#22D3EE">// AI VOICE ASSISTANT · 语音助手三强对决</text>
  <text x="94" y="145" font-family="Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="700" fill="#F8FAFC">AI 语音助手深度拆解：Siri AI vs 小艺管家 vs 超级小爱</text>
  <rect x="96" y="165" width="520" height="3" rx="1.5" fill="#22D3EE"/>
  <text x="96" y="192" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">来源：Apple 官方产品页/新闻稿 · 华为 S2 官方产品页 · 小米智能家庭屏 11 产品页 · 未披露项标注「官方未公布」</text>

  <!-- Siri AI card -->
  <g transform="translate(60 220)">
    <rect x="0" y="0" width="380" height="380" rx="16" fill="#0E1830" stroke="#0EA5E9"/>
    <rect x="0" y="0" width="380" height="60" rx="16" fill="#0EA5E9" opacity="0.12"/>
    <text x="190" y="40" font-family="Helvetica Neue, sans-serif" font-size="24" font-weight="700" fill="#7DD3FC" text-anchor="middle">Siri AI (Apple)</text>

    <text x="24" y="92" font-family="Consolas, monospace" font-size="13" fill="#64748B">CAPABILITIES · 能力</text>
    <text x="24" y="116" font-family="Arial, sans-serif" font-size="15" fill="#E2E8F0">· 广博世界知识：食谱/维修/百科即时回答</text>
    <text x="24" y="140" font-family="Arial, sans-serif" font-size="15" fill="#E2E8F0">· 屏幕感知：理解当前屏幕内容上下文</text>
    <text x="24" y="164" font-family="Arial, sans-serif" font-size="15" fill="#E2E8F0">· 个人语境：配对 iPhone/iPad 后读取日历/消息</text>

    <text x="24" y="204" font-family="Consolas, monospace" font-size="13" fill="#64748B">MULTIUSER · 多用户</text>
    <text x="24" y="228" font-family="Arial, sans-serif" font-size="15" fill="#E2E8F0">· 最多识别 6 人（人脸+声音）</text>
    <text x="24" y="252" font-family="Arial, sans-serif" font-size="15" fill="#E2E8F0">· 内容隔离：个人消息/日历仅本人可见</text>

    <text x="24" y="292" font-family="Consolas, monospace" font-size="13" fill="#64748B">PRIVACY · 隐私</text>
    <text x="24" y="316" font-family="Arial, sans-serif" font-size="15" fill="#E2E8F0">· Secure Exclaves 硬件隔离音视频</text>
    <text x="24" y="340" font-family="Arial, sans-serif" font-size="15" fill="#E2E8F0">· 端侧处理 + Private Cloud Compute</text>
    <text x="24" y="364" font-family="Arial, sans-serif" font-size="13" fill="#64748B">· 仅英语起步 · EU 不售（Siri AI 政策）</text>
  </g>

  <!-- 小艺管家 card -->
  <g transform="translate(460 220)">
    <rect x="0" y="0" width="380" height="380" rx="16" fill="#0E1830" stroke="#F59E0B"/>
    <rect x="0" y="0" width="380" height="60" rx="16" fill="#F59E0B" opacity="0.12"/>
    <text x="190" y="40" font-family="Helvetica Neue, sans-serif" font-size="24" font-weight="700" fill="#FCD34D" text-anchor="middle">小艺管家 (Huawei S2)</text>

    <text x="24" y="92" font-family="Consolas, monospace" font-size="13" fill="#64748B">CAPABILITIES · 能力</text>
    <text x="24" y="116" font-family="Arial, sans-serif" font-size="15" fill="#E2E8F0">· 可视可说：屏幕可见即可语音控制</text>
    <text x="24" y="140" font-family="Arial, sans-serif" font-size="15" fill="#E2E8F0">· 全双工对话：连续对话、可打断、可插话</text>
    <text x="24" y="164" font-family="Arial, sans-serif" font-size="15" fill="#E2E8F0">· 空间感知：挂墙自动切换当前空间界面</text>

    <text x="24" y="204" font-family="Consolas, monospace" font-size="13" fill="#64748B">INTERACTION · 交互</text>
    <text x="24" y="228" font-family="Arial, sans-serif" font-size="15" fill="#E2E8F0">· 分级 UX：全屋/系统/单品三层管控</text>
    <text x="24" y="252" font-family="Arial, sans-serif" font-size="15" fill="#E2E8F0">· 超级快控：拖拽建场景 · 长按精调</text>

    <text x="24" y="292" font-family="Consolas, monospace" font-size="13" fill="#64748B">ECOSYSTEM · 生态</text>
    <text x="24" y="316" font-family="Arial, sans-serif" font-size="15" fill="#E2E8F0">· 鸿蒙智家 · HarmonyOS 2.1</text>
    <text x="24" y="340" font-family="Arial, sans-serif" font-size="15" fill="#E2E8F0">· 与智能主机 SE 组合实现全屋中枢</text>
    <text x="24" y="364" font-family="Arial, sans-serif" font-size="13" fill="#64748B">· 官方未公布：本地处理比例/离线指令率</text>
  </g>

  <!-- 超级小爱 card -->
  <g transform="translate(860 220)">
    <rect x="0" y="0" width="380" height="380" rx="16" fill="#0E1830" stroke="#10B981"/>
    <rect x="0" y="0" width="380" height="60" rx="16" fill="#10B981" opacity="0.12"/>
    <text x="190" y="40" font-family="Helvetica Neue, sans-serif" font-size="24" font-weight="700" fill="#6EE7B7" text-anchor="middle">超级小爱 (Xiaomi 11)</text>

    <text x="24" y="92" font-family="Consolas, monospace" font-size="13" fill="#64748B">CAPABILITIES · 能力</text>
    <text x="24" y="116" font-family="Arial, sans-serif" font-size="15" fill="#E2E8F0">· AI 大模型 · 百科问答/文案创作/闲聊</text>
    <text x="24" y="140" font-family="Arial, sans-serif" font-size="15" fill="#E2E8F0">· 语音创建自动化场景（米家联动）</text>
    <text x="24" y="164" font-family="Arial, sans-serif" font-size="15" fill="#E2E8F0">· 一句话多指令：控车+控家+查信息</text>

    <text x="24" y="204" font-family="Consolas, monospace" font-size="13" fill="#64748B">VOICE · 音色</text>
    <text x="24" y="228" font-family="Arial, sans-serif" font-size="15" fill="#E2E8F0">· 拟人音色「柚子」/「蜜糖」</text>
    <text x="24" y="252" font-family="Arial, sans-serif" font-size="15" fill="#E2E8F0">· 连续对话 · 随时打断 · 上下文继承</text>

    <text x="24" y="292" font-family="Consolas, monospace" font-size="13" fill="#64748B">ECOSYSTEM · 生态</text>
    <text x="24" y="316" font-family="Arial, sans-serif" font-size="15" fill="#E2E8F0">· 澎湃OS 3 · 中枢网关 + Mesh 2.0</text>
    <text x="24" y="340" font-family="Arial, sans-serif" font-size="15" fill="#E2E8F0">· 6000+ 智能设备 + 6000+ 红外家电</text>
    <text x="24" y="364" font-family="Arial, sans-serif" font-size="13" fill="#64748B">· 官方未公布：本地处理比例/离线指令率</text>
  </g>

  <!-- Bottom verdict -->
  <rect x="96" y="630" width="1088" height="56" rx="12" fill="#0E1830" stroke="#1E3A5F"/>
  <text x="124" y="656" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" fill="#E2E8F0"><tspan fill="#7DD3FC">Siri AI</tspan>：广博世界知识 + 6人隔离 + 最强隐私架构（英语起步） · <tspan fill="#FCD34D">小艺管家</tspan>：可视可说 + 空间穿越 + 鸿蒙生态 · <tspan fill="#6EE7B7">超级小爱</tspan>：大模型对话 + 万级设备兼容 + 中文场景</text>
  <text x="124" y="678" font-family="Arial, sans-serif" font-size="13" fill="#64748B">本地处理百分比与离线指令率：三方官方均未公布 → 不列出</text>

  <text x="1210" y="690" font-family="Consolas, monospace" font-size="15" fill="#475569">08 / 12</text>
</svg>