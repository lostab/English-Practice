    <text x="20" y="130" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8">与隐私承诺</text>

    <rect x="276" y="0" width="260" height="150" rx="14" fill="#0E1830" stroke="#1E3A5F"/>
    <text x="20" y="36" font-family="Consolas, monospace" font-size="28" fill="#22D3EE" filter="url(#glow11)">02</text>
    <text x="20" y="78" font-family="Helvetica Neue, sans-serif" font-size="18" font-weight="700" fill="#E2E8F0">硬件-软件一体化</text>
    <text x="20" y="108" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8">A18 专芯 + HomeView</text>
    <text x="20" y="130" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8">不可分割的护城河</text>

    <rect x="552" y="0" width="260" height="150" rx="14" fill="#0E1830" stroke="#1E3A5F"/>
    <text x="20" y="36" font-family="Consolas, monospace" font-size="28" fill="#22D3EE" filter="url(#glow11)">03</text>
    <text x="20" y="78" font-family="Helvetica Neue, sans-serif" font-size="18" font-weight="700" fill="#E2E8F0">生态同盟而非封闭</text>
    <text x="20" y="108" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8">LG / Schneider / ADT</text>
    <text x="20" y="130" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8">关键硬件开放合作</text>

    <rect x="828" y="0" width="260" height="150" rx="14" fill="#0E1830" stroke="#1E3A5F"/>
    <text x="20" y="36" font-family="Consolas, monospace" font-size="28" fill="#22D3EE" filter="url(#glow11)">04</text>
    <text x="20" y="78" font-family="Helvetica Neue, sans-serif" font-size="18" font-weight="700" fill="#E2E8F0">隐私成为核心差异化</text>
    <text x="20" y="108" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8">端侧处理 + Private Cloud Compute</text>
    <text x="20" y="130" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8">「可信任的家庭 OS」心智</text>
  </g>

