      <text x="556" y="126" font-family="Helvetica Neue, sans-serif" font-size="15" font-weight="700" fill="#E2E8F0">Vision Pro 家庭版</text>
      <text x="556" y="148" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">空间计算进客厅</text>

      <rect x="800" y="70" width="248" height="88" rx="10" fill="#0E2440" stroke="#22D3EE" stroke-width="1.5"/>
