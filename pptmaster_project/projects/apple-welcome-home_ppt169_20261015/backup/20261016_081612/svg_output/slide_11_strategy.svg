      <text x="296" y="126" font-family="Helvetica Neue, sans-serif" font-size="15" font-weight="700" fill="#E2E8F0">传感器微型化</text>
      <text x="296" y="148" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">嵌入家电/灯具</text>

