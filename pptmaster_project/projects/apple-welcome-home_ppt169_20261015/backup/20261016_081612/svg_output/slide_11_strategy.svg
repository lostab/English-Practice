      <text x="816" y="126" font-family="Helvetica Neue, sans-serif" font-size="15" font-weight="700" fill="#A5F3FC">跨平台开放</text>
      <text x="816" y="148" font-family="Arial, sans-serif" font-size="13" fill="#7DD3FC">安卓/Windows API</text>
