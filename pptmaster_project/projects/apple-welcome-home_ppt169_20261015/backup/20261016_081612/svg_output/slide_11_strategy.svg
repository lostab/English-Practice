  <text x="94" y="150" font-family="Helvetica Neue, Arial, sans-serif" font-size="44" font-weight="700" fill="#F8FAFC">产业思考与后续演进路线</text>
  <rect x="96" y="172" width="260" height="3" rx="1.5" fill="#22D3EE"/>

  <!-- 4 strategy cards -->
  <g transform="translate(96 230)">
