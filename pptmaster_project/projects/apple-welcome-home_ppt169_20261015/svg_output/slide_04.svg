<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs><linearGradient id="bg04" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#05070F"/><stop offset="1" stop-color="#0A1120"/>
  </linearGradient></defs>
  <rect width="1280" height="720" fill="url(#bg04)"/>
  <text x="96" y="80" font-family="Consolas, monospace" font-size="20" letter-spacing="4" fill="#22D3EE">// STRATEGY · 15-YEAR EVOLUTION</text>
