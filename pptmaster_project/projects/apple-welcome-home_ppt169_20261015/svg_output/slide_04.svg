    <text x="24" y="294" font-family="Arial, sans-serif" font-size="15" fill="#E2E8F0">① 从封闭到开放：Matter 加入回应「封闭生态限制丰富度」的批评</text>
    <text x="24" y="320" font-family="Arial, sans-serif" font-size="15" fill="#E2E8F0">② 从硬件到系统：HomeView 定义「家庭智能中枢」新品类</text>
    <text x="24" y="346" font-family="Arial, sans-serif" font-size="15" fill="#E2E8F0">③ 从云端到端侧：隐私三角是苹果与华为/小米在 AI 路线上最根本的分歧</text>
