    <text x="656" y="120" font-family="Arial, sans-serif" font-size="14" fill="#E2E8F0">2026-10-13 Welcome Home 四线齐发</text>
    <text x="656" y="152" font-family="Arial, sans-serif" font-size="13" fill="#7DD3FC">跃迁：从「卖硬件」到「卖系统与体验」</text>
