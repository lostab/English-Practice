    <text x="20" y="152" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">关键节点：2016 首款 HomePod</text>
    <text x="20" y="176" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">瓶颈：生态扩张缓慢</text>

    <rect x="368" y="0" width="350" height="210" rx="14" fill="#0E1830" stroke="#1E3A5F"/>
    <text x="388" y="34" font-family="Consolas, monospace" font-size="14" fill="#7DD3FC">02 · 2018-2021</text>
    <text x="388" y="64" font-family="Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#E2E8F0">硬件试水，生态深耕</text>
    <text x="388" y="94" font-family="Arial, sans-serif" font-size="14" fill="#E2E8F0">2018 HomePod mini 低价切入 + 加入 Thread Group</text>
    <text x="388" y="120" font-family="Arial, sans-serif" font-size="14" fill="#E2E8F0">2020 HomeKit Secure Video 端到端加密</text>
    <text x="388" y="152" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">关键节点：Thread 贯穿全系</text>
    <text x="388" y="176" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">瓶颈：用户转化效率待提升</text>

    <rect x="636" y="0" width="350" height="210" rx="14" fill="#0E2440" stroke="#22D3EE"/>
    <text x="656" y="34" font-family="Consolas, monospace" font-size="14" fill="#7DD3FC">03 · 2022-2026</text>
    <text x="656" y="64" font-family="Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#A5F3FC">拥抱开放，AI 反攻</text>
