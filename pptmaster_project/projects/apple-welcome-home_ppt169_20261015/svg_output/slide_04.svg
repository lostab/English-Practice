  <rect x="96" y="158" width="300" height="3" rx="1.5" fill="#22D3EE"/>
  <text x="96" y="186" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">来源：Apple Newsroom / 官方产品页 · 仅列官方公开宣布节点</text>

  <g transform="translate(96 220)">
    <rect x="0" y="0" width="350" height="210" rx="14" fill="#0E1830" stroke="#1E3A5F"/>
    <text x="20" y="34" font-family="Consolas, monospace" font-size="14" fill="#7DD3FC">01 · 2014-2017</text>
    <text x="20" y="64" font-family="Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#E2E8F0">平台先行，标准至上</text>
    <text x="20" y="94" font-family="Arial, sans-serif" font-size="14" fill="#E2E8F0">iOS 8 集成 HomeKit 框架，确立底层通信标准</text>
