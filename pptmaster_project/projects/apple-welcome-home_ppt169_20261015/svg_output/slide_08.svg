<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs><linearGradient id="bg08" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#05070F"/><stop offset="1" stop-color="#0A1120"/>
  </linearGradient></defs>
  <rect width="1280" height="720" fill="url(#bg08)"/>
  <text x="96" y="80" font-family="Consolas, monospace" font-size="20" letter-spacing="4" fill="#22D3EE">// SUPPORTING HARDWARE · TWO UPDATES</text>
  <text x="94" y="140" font-family="Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="700" fill="#F8FAFC">Apple TV 4K（第4代）与 HomePod mini 2 深拆</text>
  <rect x="96" y="160" width="560" height="3" rx="1.5" fill="#22D3EE"/>
  <text x="96" y="190" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">来源：Apple Newsroom 官方新闻稿（2026-10-13）· 全部参数官方披露</text>

  <g transform="translate(96 220)">
    <rect x="0" y="0" width="628" height="380" rx="14" fill="#0E1830" stroke="#1E3A5F"/>
    <image href="../images/hv_atv4k.jpg" x="12" y="12" width="604" height="170" preserveAspectRatio="xMidYMid slice"/>
    <text x="20" y="210" font-family="Consolas, monospace" font-size="15" fill="#7DD3FC">// APPLE TV 4K（第4代）· $299 · 11.13</text>
    <text x="20" y="242" font-family="Arial, sans-serif" font-size="15" fill="#E2E8F0">· A19 芯片：CPU 性能 +50%，GPU 2×，新增 AV1 硬件解码</text>
    <text x="20" y="270" font-family="Arial, sans-serif" font-size="15" fill="#E2E8F0">· 三麦克风远场阵列：免提「Siri / Hey Siri」，回声消除</text>
    <text x="20" y="298" font-family="Arial, sans-serif" font-size="15" fill="#E2E8F0">· Wi-Fi 7 · Thread 内置 · 家庭中枢能力（含 HomeKit Secure Video 本地处理）</text>
    <text x="20" y="326" font-family="Arial, sans-serif" font-size="15" fill="#E2E8F0">· 四 HomePod 环绕声：智能识别扬声器位置自动校准（前后成对）</text>
    <text x="20" y="354" font-family="Arial, sans-serif" font-size="15" fill="#E2E8F0">· Siri Remote 新升级：Find My 支持 + Precision Finding + 发声定位</text>

    <rect x="648" y="0" width="440" height="380" rx="14" fill="#0E1830" stroke="#1E3A5F"/>
    <image href="../images/hv_hpm2.jpg" x="12" y="12" width="416" height="170" preserveAspectRatio="xMidYMid slice"/>
    <text x="668" y="210" font-family="Consolas, monospace" font-size="15" fill="#7DD3FC">// HOMEPOD MINI 2 · $149 · 10.30</text>
    <text x="668" y="242" font-family="Arial, sans-serif" font-size="15" fill="#E2E8F0">· S10 芯片：实时计算音频（动态范围/响度/声学优化）</text>
    <text x="668" y="270" font-family="Arial, sans-serif" font-size="15" fill="#E2E8F0">· Sound Glow：顶部随音乐律动发光，专辑封面取色</text>
    <text x="668" y="298" font-family="Arial, sans-serif" font-size="15" fill="#E2E8F0">· 5 色：粉 / 绿 / 蓝 / 白 / 午夜</text>
    <text x="668" y="326" font-family="Arial, sans-serif" font-size="15" fill="#E2E8F0">· 家庭中枢：语音控制配件与自动化 · 声音识别（烟雾/CO 警报）</text>
    <text x="668" y="354" font-family="Arial, sans-serif" font-size="15" fill="#E2E8F0">· Siri AI 将在后续软件更新推送（HomePod software 27.2）</text>
  </g>

  <rect x="96" y="620" width="1088" height="56" rx="12" fill="#0E1830" stroke="#1E3A5F"/>
  <text x="120" y="648" font-family="Arial, sans-serif" font-size="15" fill="#E2E8F0">定位：Apple TV 4K = 客厅娱乐 + 中枢备份；HomePod mini 2 = 全屋语音/音频入口 —— 与 HomeView 组成「一屏三入口」的家庭矩阵</text>
  <text x="1210" y="690" font-family="Consolas, monospace" font-size="15" fill="#475569">08 / 23</text>
</svg>