<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>魔兽世界：巫妖王之怒 (WotLK 3.3.5) 世界地图</title>
<style>
@@LEAFLET_CSS@@
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin:0; padding:0; }
html,body { width:100%; height:100%; background:#0a0e17; color:#d4af37; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif; overflow:hidden; }
#header { position:absolute; top:0; left:0; right:0; height:54px; background:linear-gradient(180deg,#151d2e,#0a0e17); border-bottom:2px solid #8c6d1f; display:flex; align-items:center; gap:12px; padding:0 14px; z-index:1000; box-shadow:0 4px 16px rgba(0,0,0,.8); }
.logo { flex:0 0 auto; }
.logo h1 { font-size:15px; color:#f3f4f6; font-weight:800; letter-spacing:1px; margin:0; text-shadow:0 0 8px rgba(212,175,55,.4); }
.logo span { font-size:10px; color:#9aa4b5; display:block; }
.tabs { display:flex; gap:5px; background:#202a3f; padding:3px; border-radius:7px; border:1px solid #37415a; }
.tab-btn { background:transparent; border:none; color:#aab4c8; padding:5px 12px; border-radius:5px; font-size:12px; cursor:pointer; font-weight:600; transition:.2s; }
.tab-btn.active,.tab-btn:hover { background:#b8860b; color:#fff; box-shadow:0 2px 8px rgba(184,134,11,.5); }
.spacer { flex:1; }
.lang-btn { background:#202a3f; border:1px solid #37415a; color:#fbbf24; padding:5px 12px; border-radius:5px; font-size:12px; cursor:pointer; font-weight:700; }
.lang-btn:hover { background:#2c3854; }
#map { position:absolute; top:54px; bottom:0; left:0; right:0; background:#060a12; }
.path-btn { position:absolute; top:62px; left:12px; z-index:1001; background:#202a3f; border:1px solid #8c6d1f; color:#e8d9a8; padding:6px 12px; border-radius:5px; font-size:12px; cursor:pointer; display:none; align-items:center; gap:6px; }
.path-btn:hover { background:#2c3854; }
#cur-label { position:absolute; top:62px; left:50%; transform:translateX(-50%); z-index:1000; background:rgba(10,14,23,.82); border:1px solid #8c6d1f; color:#f3f4f6; padding:7px 16px; border-radius:20px; font-size:13px; font-weight:700; pointer-events:none; white-space:nowrap; }
#zoom-hint { position:absolute; bottom:18px; right:14px; z-index:1000; background:rgba(10,14,23,.85); border:1px solid #8c6d1f; color:#c9b97e; padding:6px 12px; border-radius:6px; font-size:11px; pointer-events:none; }
.sidebar-toggle { position:absolute; bottom:20px; left:16px; z-index:1000; background:#202a3f; border:2px solid #8c6d1f; color:#fbbf24; width:46px; height:46px; border-radius:50%; font-size:20px; display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 4px 12px rgba(0,0,0,.6); }
.sidebar-toggle:hover { background:#2c3854; }
#sidebar { position:absolute; top:54px; left:-290px; width:290px; bottom:0; background:rgba(13,18,30,.94); backdrop-filter:blur(12px); border-right:2px solid #8c6d1f; z-index:999; transition:left .3s ease; display:flex; flex-direction:column; box-shadow:6px 0 22px rgba(0,0,0,.55); }
#sidebar.open { left:0; }
.sb-head { padding:14px 16px; border-bottom:1px solid #37415a; font-weight:700; color:#fbbf24; font-size:14px; display:flex; justify-content:space-between; align-items:center; }
.sb-content { flex:1; overflow-y:auto; padding:10px; }
.zone-item { padding:9px 12px; margin-bottom:5px; border-radius:6px; background:rgba(32,42,63,.55); border:1px solid #37415a; cursor:pointer; transition:.2s; }
.zone-item:hover { background:#2c3854; border-color:#b8860b; }
.zone-item .nm { font-size:13px; font-weight:600; color:#f3f4f6; }
.zone-item .lv { font-size:11px; color:#9aa4b5; margin-top:2px; }
.leaflet-popup-content-wrapper,.leaflet-popup-tip { background:rgba(15,21,36,.96)!important; color:#f3f4f6!important; border:2px solid #b8860b; border-radius:8px; box-shadow:0 10px 34px rgba(0,0,0,.95); }
.leaflet-popup-content h3 { margin:0 0 6px; color:#fbbf24; font-size:14px; border-bottom:1px dashed #4b5563; padding-bottom:5px; display:flex; align-items:center; gap:8px; }
.leaflet-popup-content p { margin:4px 0 0; font-size:12px; color:#c9d2e0; line-height:1.55; }
.btn-enter { background:linear-gradient(180deg,#b8860b,#8c6d1f); border:none; color:#fff; font-weight:700; font-size:12px; padding:6px 14px; border-radius:4px; cursor:pointer; margin-top:8px; }
.btn-enter:hover { filter:brightness(1.15); }
.zone-heat { fill:rgba(184,134,11,.10); stroke:#d4af37; stroke-width:1.5; cursor:pointer; }
.zone-heat:hover { fill:rgba(184,134,11,.30); }
@media(max-width:768px) { .logo span { display:none; } .logo h1 { font-size:12px; } .tab-btn { padding:4px 7px; font-size:11px; } #cur-label { font-size:11px; } }
</style>
</head>
<body>

<div id="header">
  <div class="logo">
    <h1 id="ui-title">魔兽世界 · 巫妖王之怒</h1>
    <span id="ui-subtitle">WotLK 3.3.5 世界地图 — 点击区域下钻</span>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab-btn active" data-c="azeroth" onclick="switchContinent('azeroth',this)">艾泽拉斯</button>
    <button class="tab-btn" data-c="northrend" onclick="switchContinent('northrend',this)">诺森德</button>
    <button class="tab-btn" data-c="outland" onclick="switchContinent('outland',this)">外域</button>
  </div>
  <div class="spacer"></div>
  <button class="lang-btn" id="langBtn" onclick="toggleLang()">EN</button>
</div>

<div id="map"></div>
<div id="cur-label">艾泽拉斯</div>
<button class="path-btn" id="backBtn" onclick="goOverview()">← <span id="backLabel">返回总览</span></button>
<div id="zoom-hint">🖱 滚轮缩放 · 拖动平移 · 点击区域进入</div>

<div class="sidebar-toggle" onclick="toggleSidebar()">🗺️</div>
<div id="sidebar">
  <div class="sb-head"><span id="sbTitle">区域列表</span><span style="cursor:pointer;font-size:16px" onclick="toggleSidebar()">✕</span></div>
  <div class="sb-content" id="sbList"></div>
</div>

<script>
@@LEAFLET_JS@@
</script>
<script>
/* ===== 数据 ===== */
const IMGS = { @@IMGS@@ };
const ZONES = @@ZONES@@;
const CITIES = @@CITIES@@;

let curLang = 'zh';
let curContinent = 'azeroth';
let curZone = null;   // null = 总览
let overlay = null, heatLayer = null, labelLayer = null;

const map = L.map('map', {
  crs: L.CRS.Simple,
  minZoom: -1,
  maxZoom: 4,
  zoomSnap: 0.25,
  zoomDelta: 0.5,
  attributionControl: false,
  zoomControl: false
});
L.control.zoom({position:'bottomright'}).addTo(map);
heatLayer = L.layerGroup().addTo(map);
labelLayer = L.layerGroup().addTo(map);

function I(key){ return 'data:image/jpeg;base64,' + IMGS[key].b; }
function t(zh,en){ return curLang==='zh' ? zh : en; }

function showImg(key, fit){
  if (overlay) map.removeLayer(overlay);
  const img = IMGS[key];
  const bounds = [[0,0],[img.h,img.w]];
  overlay = L.imageOverlay(I(key), bounds).addTo(map);
  map.setMaxBounds(null);
  if (fit) map.fitBounds(bounds, {padding:[8,8]});
}

function loadOverview(){
  const c = ZONES[curContinent];
  curZone = null;
  heatLayer.clearLayers();
  labelLayer.clearLayers();
  showImg(c.overview, true);
  document.getElementById('cur-label').textContent = t(c.nameZh, c.nameEn);
  document.getElementById('backBtn').style.display = 'none';
  // 区域热区 + 标签
  c.zones.forEach(function(z){
    const img = IMGS[c.overview];
    const cx = z.x*img.w, cy = z.y*img.h, w = z.w*img.w, h = z.h*img.h;
    const rect = [[cy-h/2,cx-w/2],[cy-h/2,cx+w/2],[cy+h/2,cx+w/2],[cy+h/2,cx-w/2]];
    const poly = L.polygon(rect, {className:'zone-heat', interactive:true});
    poly.on('click', function(){ enterZone(z); });
    heatLayer.addLayer(poly);
    const lbl = L.marker([cy,cx], {icon:L.divIcon({className:'zl', html:'<div style="color:#ffe9a8;font-weight:800;font-size:12px;text-shadow:0 1px 3px #000,0 0 8px #000;white-space:nowrap;transform:translate(-50%,-50%)">'+t(z.zh,z.en)+'</div>', iconSize:[0,0]}), interactive:false});
    labelLayer.addLayer(lbl);
  });
  // 城市快速入口
  (CITIES[curContinent]||[]).forEach(function(ct){
    const cty = L.marker([ct.y||30, ct.x||30], {icon:L.divIcon({className:'zc', html:'<div style="background:#d97706;color:#fff;border:2px solid #fef08a;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800">★</div>', iconSize:[22,22], iconAnchor:[11,11]}), interactive:true});
    cty.on('click', function(){ enterCity(ct); });
    labelLayer.addLayer(cty);
  });
  updateSidebar();
}

function enterZone(z){
  curZone = z;
  heatLayer.clearLayers();
  labelLayer.clearLayers();
  showImg(z.img, true);
  document.getElementById('cur-label').textContent = t(z.zh, z.en);
  document.getElementById('backBtn').style.display = 'flex';
  document.getElementById('backLabel').textContent = t('返回 '+ZONES[curContinent].nameZh, 'Back to '+ZONES[curContinent].nameEn);
  // 弹窗摘要
  L.popup().setLatLng([IMGS[z.img].h*0.5, IMGS[z.img].w*0.5]).setContent(
    '<h3>'+t(z.zh,z.en)+'</h3><p>'+t(z.desc,z.desc)+'</p>'
  ).openOn(map);
  updateSidebar();
}

function enterCity(ct){
  curZone = ct;
  heatLayer.clearLayers();
  labelLayer.clearLayers();
  showImg(ct.img, true);
  document.getElementById('cur-label').textContent = t(ct.zh, ct.en);
  document.getElementById('backBtn').style.display = 'flex';
  document.getElementById('backLabel').textContent = t('返回 '+ZONES[curContinent].nameZh, 'Back to '+ZONES[curContinent].nameEn);
  updateSidebar();
}

function goOverview(){ loadOverview(); }

function switchContinent(key, btn){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  curContinent = key;
  loadOverview();
}

function updateSidebar(){
  const c = ZONES[curContinent];
  const box = document.getElementById('sbList');
  box.innerHTML = '';
  document.getElementById('sbTitle').textContent = t(c.nameZh+' 区域', c.nameEn+' Zones');
  c.zones.forEach(function(z){
    const d = document.createElement('div');
    d.className = 'zone-item';
    d.innerHTML = '<div class="nm">'+t(z.zh,z.en)+'</div><div class="lv">'+t(z.desc,z.desc)+'</div>';
    d.onclick = function(){ enterZone(z); toggleSidebar(); };
    box.appendChild(d);
  });
  (CITIES[curContinent]||[]).forEach(function(ct){
    const d = document.createElement('div');
    d.className = 'zone-item';
    d.innerHTML = '<div class="nm">★ '+t(ct.zh,ct.en)+'</div><div class="lv">'+t(ct.desc,ct.desc)+'</div>';
    d.onclick = function(){ enterCity(ct); toggleSidebar(); };
    box.appendChild(d);
  });
}

function toggleLang(){
  curLang = curLang==='zh' ? 'en' : 'zh';
  document.getElementById('langBtn').textContent = curLang==='zh' ? 'EN' : '中';
  document.getElementById('ui-title').textContent = t('魔兽世界 · 巫妖王之怒','World of Warcraft · WotLK');
  document.getElementById('ui-subtitle').textContent = t('WotLK 3.3.5 世界地图 — 点击区域下钻','WotLK 3.3.5 World Map — click a zone to zoom in');
  document.querySelectorAll('.tab-btn').forEach(b=>{ b.textContent = t(ZONES[b.getAttribute('data-c')].nameZh, ZONES[b.getAttribute('data-c')].nameEn); });
  if (curZone===null) loadOverview();
  else if (curZone.img) { showImg(curZone.img,false); document.getElementById('cur-label').textContent = t(curZone.zh,curZone.en); }
  updateSidebar();
}

function toggleSidebar(){ document.getElementById('sidebar').classList.toggle('open'); }

window.addEventListener('load', function(){ loadOverview(); });
</script>
</body>
</html>
